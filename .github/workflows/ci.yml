name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint + tests ──────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (for chromadb, pymupdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Create .env from example (needed for config.py import)
        run: cp .env.example .env

      - name: Syntax check (all Python files)
        run: python -m compileall .

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  # ── Frontend: lint + tests + build ─────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # ── Docker: verify images build ────────────────────────
  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t studydash-api ./server

      - name: Build frontend image
        run: docker build -t studydash-ui .

      - name: Verify compose config
        run: docker compose config
